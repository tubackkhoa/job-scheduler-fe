<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Background -->
    <rect width="64" height="64" rx="12" fill="#2563EB" />

    <!-- Clock circle (closer to edges) -->
    <circle cx="32" cy="32" r="26" fill="#FFFFFF" />

    <!-- Clock hands -->
    <line x1="32" y1="32" x2="32" y2="18" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="32" x2="44" y2="38" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />

    <!-- Checkmark -->
    <path d="M22 34 L28 40 L42 26"
        fill="none"
        stroke="#22C55E"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>